[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tool"]

[project]
name = "agent-guild-observation-tool"
version = "0.1.0"
description = "Optional bounded Agent Guild endpoint observation for Atomic Agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "AgentTanuki" }]
dependencies = [
    "atomic-agents>=2.10.2,<3.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.6.1,<8.0.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
]

[tool.uv.sources]
atomic-agents = { workspace = true }
